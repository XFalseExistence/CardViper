name: HEVEL Pixel Bridge APK
on:
  push:
    branches:
      - native/hevel-pixel-bridge-apk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack HEVEL Pixel Bridge sources
        run: |
          mkdir -p pixel-bridge
          base64 -d hevel-pixel-source.zip.b64 > /tmp/hevel-pixel-source.zip
          unzip -oq /tmp/hevel-pixel-source.zip -d pixel-bridge
          test -f pixel-bridge/app/src/main/java/com/hevel/pixelbridge/MainActivity.java
      - name: Prepare consistent HEVEL debug signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hevel-signing"
          curl -fsSL "https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8" -o "$RUNNER_TEMP/hevel-signing/testkey.pk8"
          curl -fsSL "https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem" -o "$RUNNER_TEMP/hevel-signing/testkey.x509.pem"
          openssl pkcs8 -inform DER -in "$RUNNER_TEMP/hevel-signing/testkey.pk8" -out "$RUNNER_TEMP/hevel-signing/testkey.pem" -nocrypt
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/hevel-signing/testkey.pem" -in "$RUNNER_TEMP/hevel-signing/testkey.x509.pem" -name heveldebug -out "$RUNNER_TEMP/hevel-signing/heveldebug.p12" -passout pass:android
          echo "HEVEL_DEBUG_KEYSTORE=$RUNNER_TEMP/hevel-signing/heveldebug.p12" >> "$GITHUB_ENV"
      - name: Apply HevelBridge name, original icon, retro palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root=Path("pixel-bridge/app/src/main")
          manifest=root/"AndroidManifest.xml"
          m=manifest.read_text()
          m=m.replace('android:label="HEVEL Pixel Bridge"', 'android:label="HevelBridge" android:icon="@drawable/hevel_controller"')
          manifest.write_text(m)
          src=root/"java/com/hevel/pixelbridge/MainActivity.java"
          s=src.read_text()
          s=s.replace('HEVEL  //  PIXEL BRIDGE', 'HEVELBRIDGE  //  ARCADE LINK')
          s=s.replace('0xff071119, PANEL=0xff13242d, ACCENT=0xff39d9ff, TEXT=0xffc8e8eb, WARN=0xffffbe69',
                      '0xff15131d, PANEL=0xff302c3b, ACCENT=0xffbba4ff, TEXT=0xffede8f2, WARN=0xffe3c384')
          s=s.replace('0xff265161', '0xff655679').replace('0xff7499a3', '0xff998bac')
          s=s.replace('0xff8eafb8','0xffaca3ba')
          src.write_text(s)
          drawable=root/"res/drawable"
          drawable.mkdir(parents=True,exist_ok=True)
          (drawable/"hevel_controller.png").write_bytes(base64.b64decode(Path("hevel-controller-icon.png.b64").read_text().strip()))
          gradle=Path("pixel-bridge/app/build.gradle")
          g=gradle.read_text()
          g=g.replace("applicationId 'com.hevel.pixelbridge'", "applicationId 'com.hevel.arcade.pixelbridge'")
          g=g.replace("versionCode 1","versionCode 12").replace("versionName '1.0.0'","versionName '1.2.0'")
          assert "applicationId 'com.hevel.arcade.pixelbridge'" in g
          g += "\n" + "\n".join([
              "android {",
              "  signingConfigs {",
              "    hevelDebug {",
              "      storeFile file(System.getenv('HEVEL_DEBUG_KEYSTORE'))",
              "      storePassword 'android'",
              "      keyAlias 'heveldebug'",
              "      keyPassword 'android'",
              "    }",
              "  }",
              "  buildTypes { debug { signingConfig signingConfigs.hevelDebug } }",
              "}",
          ]) + "\n"
          gradle.write_text(g)
          print("HEVELBRIDGE_NAME_ICON_THEME_OK")
          PY
      - name: Build Android APK
        run: gradle -p pixel-bridge --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s pixel-bridge/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs pixel-bridge/app/build/outputs/apk/debug/app-debug.apk
          sha256sum pixel-bridge/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Pixel Bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: HevelBridge-V1-2-stable-signing-apk
          path: pixel-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
