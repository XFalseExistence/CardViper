[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardviper-ml"
version = "0.1.0"
description = "Offline CardViper dataset preparation tools (no training runtime)"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cardviper-labels = "cardviper_ml.labels:main"
cardviper-import = "cardviper_ml.import_roboflow:main"
cardviper-splits = "cardviper_ml.splits:main"

[tool.setuptools.packages.find]
include = ["cardviper_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
