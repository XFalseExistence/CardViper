[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardviper-ml"
version = "0.1.0"
description = "Offline CardViper dataset preparation tools (no training runtime)"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
train = ["tensorflow>=2.16,<2.23", "numpy>=1.26,<3"]

[project.scripts]
cardviper-labels = "cardviper_ml.labels:main"
cardviper-import = "cardviper_ml.import_roboflow:main"
cardviper-splits = "cardviper_ml.splits:main"
cardviper-crops = "cardviper_ml.build_classifier_crops:main"
cardviper-classifier-preflight = "cardviper_ml.classifier_preflight:main"

[tool.setuptools.packages.find]
include = ["cardviper_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
